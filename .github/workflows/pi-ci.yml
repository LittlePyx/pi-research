name: Pi code checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-code-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    name: Node 24 lint, build, tests and offline discovery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # npm test builds once before exercising the product and local Worker/D1.
      # Never run another build concurrently against the same dist directory.
      - name: Build and run deterministic product tests
        run: npm test
      - name: Check offline discovery benchmark
        run: npm run test:discovery
      # Public-provider probes and production health belong to separate runs.
      # This workflow needs no model key, scheduler secret or deployment access.
