name: Pi background research scheduler

on:
  schedule:
    # Twice hourly, away from the high-contention start of the hour. A visit
    # still provides a 25-minute backstop for an actively used workspace.
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: pi-background-research-scheduler
  cancel-in-progress: false

jobs:
  wake-background-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the Pi background worker
        env:
          PI_SCHEDULER_SECRET: ${{ secrets.PI_SCHEDULER_SECRET }}
        run: |
          test -n "$PI_SCHEDULER_SECRET"
          response="$(curl --silent --show-error --fail-with-body \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 240 \
            --request POST \
            --header "Authorization: Bearer $PI_SCHEDULER_SECRET" \
            https://pi-research-agent.qiudao-pika.chatgpt.site/api/internal/scheduler)"
          jq -e '(.acquired == true) or (.acquired == false)' <<<"$response" >/dev/null

  production-reliability-health:
    name: Production reliability health
    needs: wake-background-research
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check persistent production incidents
        env:
          PI_SCHEDULER_SECRET: ${{ secrets.PI_SCHEDULER_SECRET }}
        run: |
          test -n "$PI_SCHEDULER_SECRET"
          health="$(curl --silent --show-error --fail-with-body \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $PI_SCHEDULER_SECRET" \
            https://pi-research-agent.qiudao-pika.chatgpt.site/api/internal/reliability)"
          jq '{status, persistentCriticalCount, currentCriticalCount, currentDegradedCount, blockingReasons, incidents, scheduler}' <<<"$health"
          jq -e '.healthy == true' <<<"$health" >/dev/null
